name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Last and non-blocking: asks Cloudflare Pages to rebuild galyavin.com, whose build step writes this
      # release's version, date and link into the telex row. A failure here never marks the release red.
      - name: Refresh the telex row on galyavin.com
        continue-on-error: true
        timeout-minutes: 1
        env:
          HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "PAGES_DEPLOY_HOOK not set; skipped"; exit 0; }
          curl -fsS --max-time 20 -X POST "$HOOK" >/dev/null || echo "::warning::galyavin.com deploy hook failed; the row updates at the next site deploy"
